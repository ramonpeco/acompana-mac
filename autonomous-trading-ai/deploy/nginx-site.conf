# Example for servers that ALREADY run nginx (the installer never edits nginx).
# Copy to /etc/nginx/sites-available/trading-ai, adjust server_name, enable, then:
#   sudo nginx -t && sudo systemctl reload nginx && sudo certbot --nginx -d trading.example.com
server {
    listen 80;
    server_name trading.example.com;

    location / {
        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
    location /api/ws {
        proxy_pass http://127.0.0.1:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;
    }
}
